{% extends "tma/base.html" %}

{% block content %}
<h5 class="fw-bold mb-3 animate-in"><i class="fas fa-headset text-brand me-2"></i>Поддержка</h5>

<div class="section-card animate-in">
    <p class="text-gray small mb-3">
        Опишите проблему или вопрос — сообщение уйдёт нашим операторам.
        Ответ придёт вам в личные сообщения от бота в Telegram.
    </p>

    <label class="form-label small fw-bold" for="tmaSupportText">Ваше сообщение</label>
    <textarea id="tmaSupportText" class="form-control" rows="5" maxlength="2000"
              placeholder="Опишите, что случилось..."></textarea>

    <div id="tmaSupportResult" class="small mt-2"></div>

    <button type="button" class="btn btn-brand w-100 mt-3" id="tmaSupportSendBtn" onclick="tmaSendSupportMessage()">
        <span class="btn-text"><i class="fas fa-paper-plane me-1"></i> Отправить</span>
    </button>
</div>
{% endblock %}
